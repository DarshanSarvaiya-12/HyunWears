# Why we use this: Instructs Codemagic's free-tier Apple Silicon server on how to build our HyunWears APK.
workflows:
  hyunwears-debug-apk:
    name: Build HyunWears Test APK
    max_build_duration: 30
    # Why we use this: mac_mini_m2 is the exact machine included in Codemagic's 500-minute Free Plan.
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Generate Gradle Wrapper & Build Debug APK
        script: |
          # Why we use this: Tells Android where the SDK is located on the cloud machine, creates the wrapper, and builds the APK.
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle wrapper --gradle-version 8.11.1
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      # Why we use this: Grabs the finished .apk file so you can download it to your phone.
      - app/build/outputs/apk/debug/*.apk
