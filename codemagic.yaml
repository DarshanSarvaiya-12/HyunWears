# Why we use this: Instructs Codemagic's free-tier Apple Silicon server on how to build our HyunWears APK without failing.
workflows:
  hyunwears-debug-apk:
    name: Build HyunWears Test APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Generate Gradle Wrapper & Build Debug APK
        script: |
          set -e
          # Why we use this: Points Gradle to Codemagic's pre-installed Android SDK.
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          # Why we use this: Jetpack Compose requires AndroidX to be enabled, otherwise the build fails with status code 1.
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

          # Why we use this: Temporarily hides settings and build files so the system Gradle generates the wrapper cleanly without version conflicts.
          mv settings.gradle.kts settings.gradle.kts.bak
          mv build.gradle.kts build.gradle.kts.bak
          echo "rootProject.name = \"HyunWears\"" > settings.gradle.kts

          # Why we use this: Generates the Gradle 8.11.1 wrapper cleanly.
          gradle wrapper --gradle-version 8.11.1

          # Why we use this: Restores your real project configuration files now that ./gradlew is ready.
          mv settings.gradle.kts.bak settings.gradle.kts
          mv build.gradle.kts.bak build.gradle.kts

          # Why we use this: Compiles the debug APK using the newly generated wrapper.
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      # Why we use this: Grabs the finished .apk file so you can download it to your phone.
      - app/build/outputs/apk/debug/*.apk
